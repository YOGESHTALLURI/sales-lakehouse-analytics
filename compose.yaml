# =============================================================================
# Local development stack.
#
#   cp .env.example .env
#   docker compose up -d
#
# Phase 1 provisions the two stateful boundaries of the platform:
#
#   postgres  — OLTP system of record
#   minio     — immutable raw data lake (S3-compatible)
#
# The `api`, `web` and `etl` services are introduced by the phases that own
# them (see IMPLEMENTATION_PLAN.md §9) so that `docker compose up` succeeds at
# every point in the repository history.
# =============================================================================

name: sales-lakehouse

services:
  postgres:
    image: postgres:16-alpine
    container_name: sales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Deterministic collation so ORDER BY results match across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - sales-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sales-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - sales-net

  # One-shot bucket provisioning. Idempotent: safe to re-run on every `up`.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: sales-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      LAKE_BUCKET: ${LAKE_BUCKET:-sales-lake}
    entrypoint: ["/bin/sh", "/usr/local/bin/create-bucket.sh"]
    volumes:
      - ./infra/minio/create-bucket.sh:/usr/local/bin/create-bucket.sh:ro
    restart: "no"
    networks:
      - sales-net

volumes:
  postgres-data:
    name: sales-lakehouse-postgres-data
  minio-data:
    name: sales-lakehouse-minio-data

networks:
  sales-net:
    name: sales-lakehouse-net
    driver: bridge
