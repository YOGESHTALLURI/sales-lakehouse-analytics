# =============================================================================
# Local development stack.
#
#   cp .env.example .env
#   docker compose up -d
#
# All phases are merged, so `docker compose up -d` starts the whole platform:
#
#   postgres    — OLTP system of record
#   minio       — immutable raw data lake (S3-compatible)
#   api         — Express service: operational, analytics and pipeline-control endpoints
#   web         — the React UI, built and served by nginx, which reverse-proxies
#                 /api and /health to `api` so the browser never needs CORS
#   etl-worker  — watches pipeline_runs for queued runs and executes them
#   etl         — the batch job itself; run on demand, not part of `up` (see below)
# =============================================================================

name: sales-lakehouse

services:
  postgres:
    image: postgres:16-alpine
    container_name: sales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Deterministic collation so ORDER BY results match across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - sales-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: sales-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - sales-net

  # One-shot bucket provisioning. Idempotent: safe to re-run on every `up`.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: sales-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      LAKE_BUCKET: ${LAKE_BUCKET:-sales-lake}
    entrypoint: ["/bin/sh", "/usr/local/bin/create-bucket.sh"]
    volumes:
      - ./infra/minio/create-bucket.sh:/usr/local/bin/create-bucket.sh:ro
    restart: "no"
    networks:
      - sales-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: sales-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Fixed inside the container; only the published host port is configurable.
      API_PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      WAREHOUSE_PATH: ${WAREHOUSE_PATH:-/warehouse/sales.duckdb}
    ports:
      - "${API_HOST_PORT:-4000}:4000"
    volumes:
      # Read-only: the ETL is the only writer of the warehouse, and a read-only
      # mount makes it impossible for the API to corrupt it.
      - warehouse-data:/warehouse:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - sales-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: sales-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    healthcheck:
      # 127.0.0.1, not localhost: nginx's default config binds 0.0.0.0 only, and
      # Alpine's musl resolver tries ::1 first, so `localhost` here reliably
      # reports unhealthy with a connection refused that has nothing to do with
      # whether nginx is actually serving.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/index.html >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - sales-net

  # Batch job, not a service: it runs to completion and exits, so it is invoked
  # explicitly rather than started by `up`.
  #
  #   docker compose run --rm etl python -m etl.run_pipeline
  #
  # `profiles` keeps it out of `docker compose up`, which would otherwise report
  # the container as exited and confuse a first-run health check.
  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    image: sales-lakehouse-etl:latest
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      LAKE_BUCKET: ${LAKE_BUCKET:-sales-lake}
      LAKE_RAW_PREFIX: ${LAKE_RAW_PREFIX:-raw}
      WAREHOUSE_PATH: ${WAREHOUSE_PATH:-/warehouse/sales.duckdb}
    volumes:
      # Read-write: the ETL is the only writer of the warehouse. The API mounts
      # this same volume read-only, so it can never corrupt what it reads.
      - warehouse-data:/warehouse
    networks:
      - sales-net

  # Long-lived counterpart to the one-shot `etl` job above: it watches
  # pipeline_runs for rows the API enqueued and executes them.
  #
  # This is what lets POST /api/pipeline/run work without putting Python in the
  # API image or mounting the Docker socket into an internet-facing service.
  etl-worker:
    image: sales-lakehouse-etl:latest
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: sales-etl-worker
    restart: unless-stopped
    command: ["python", "-m", "etl.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      LAKE_BUCKET: ${LAKE_BUCKET:-sales-lake}
      LAKE_RAW_PREFIX: ${LAKE_RAW_PREFIX:-raw}
      WAREHOUSE_PATH: ${WAREHOUSE_PATH:-/warehouse/sales.duckdb}
    volumes:
      - warehouse-data:/warehouse
    networks:
      - sales-net

volumes:
  postgres-data:
    name: sales-lakehouse-postgres-data
  minio-data:
    name: sales-lakehouse-minio-data
  # Shared only between api (read-only) and etl (exclusive writer).
  warehouse-data:
    name: sales-lakehouse-warehouse-data

networks:
  sales-net:
    name: sales-lakehouse-net
    driver: bridge
