server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors vite.config.ts's dev-server proxy: the same reverse-proxy design in
    # the container that keeps every request same-origin in development. The API
    # has no CORS middleware and the bundle has no base URL compiled into it — the
    # app only ever calls relative /api and /health paths, so this is what makes
    # those paths resolve to something real once the dev server is gone.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # react-router's BrowserRouter needs every unmatched path to fall back to
    # index.html, or reloading a deep link like /sales/new returns nginx's 404
    # instead of letting the client-side router handle it.
    location / {
        try_files $uri /index.html;
    }

    # Fingerprinted assets (Vite hashes filenames on every build) are safe to
    # cache forever; index.html is not fingerprinted and must always be revalidated
    # or a deploy would not reach clients with a cached shell.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
